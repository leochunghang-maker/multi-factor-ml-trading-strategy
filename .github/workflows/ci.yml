name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # requirements.lock pins every package (incl. transitive) with hashes;
      # requirements.txt stays the hand-edited list of direct dependencies.
      - name: Install dependencies (locked)
        run: pip install --require-hashes -r requirements.lock

      - name: Run unit tests
        run: pytest -q

      - name: Run smoke tests
        run: python scripts/run_smoke_tests.py
